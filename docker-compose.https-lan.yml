# LAN HTTPS overlay — Face ID / passkeys on https://headroom.local, no public
# domain needed. Caddy terminates TLS with its own local CA (Let's Encrypt
# can't issue for .local) and the app advertises the name over mDNS, so this
# overlay includes host networking — do NOT stack docker-compose.mdns.yml on
# top, it's built in. Linux/Pi only (host networking).
#
#   docker compose -f docker-compose.yml -f docker-compose.https-lan.yml up -d --build
#
# Each device must then trust Caddy's root certificate once — the full
# per-device walkthrough lives in the README ("HTTPS on the LAN").
#
# Host networking claims only the ports these two processes bind (80, 443,
# 8000) — anything else on the host can keep serving on other ports.
services:
  headroom:
    network_mode: host
    ports: !override []
    environment:
      # Advertise the HTTPS front door, not the bare uvicorn port.
      HEADROOM_MDNS_PORT: "443"
      HEADROOM_RP_ID: "${HEADROOM_MDNS_HOSTNAME:-headroom}.local"
      HEADROOM_ORIGIN: "https://${HEADROOM_MDNS_HOSTNAME:-headroom}.local"
      HEADROOM_CORS_ORIGINS: '["https://${HEADROOM_MDNS_HOSTNAME:-headroom}.local"]'
      # Caddy reaches uvicorn over loopback on the shared host stack; :8000
      # stays LAN-reachable here, so trust forwarded headers from loopback
      # ONLY (a LAN client hitting :8000 directly must not spoof its IP).
      FORWARDED_ALLOW_IPS: "127.0.0.1"
    volumes:
      # Read-only, so the app can hand out Caddy's ROOT certificate at
      # /api/public/ca-certificate. Every device has to trust that CA before
      # passkeys work, and the alternative was `docker compose cp` on the Pi
      # followed by AirDrop.
      #
      # This mounts the EXPORT volume, which holds exactly one public
      # certificate — not Caddy's PKI. Mounting the PKI is what the overlay
      # used to do, and it never once worked: Caddy creates that tree
      # 0700 root:root, this app runs as a non-root user by policy, so the
      # route could not traverse into it and answered 404 on every install.
      # Copying one file out fixes that and is the stronger arrangement
      # anyway — there is no key material in this container's view to serve
      # by mistake.
      - caddy-ca:/caddy-ca:ro

  # Deliberately self-contained rather than layered on docker-compose.https.yml
  # (keeps the run command to two -f flags). The two caddy blocks are no longer
  # interchangeable and should not be re-synced: that one gets its certificates
  # from Let's Encrypt, which sets its own 90-day lifetime and renews over the
  # public internet, so the CLI form is fine there. Only the INTERNAL CA below
  # has a lifetime this repo chooses, and choosing it needs a Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: headroom-caddy
    restart: unless-stopped
    # Bounded like the app is: an unbounded json-file log on a Pi's SD card
    # and an unbounded sidecar were the two limits the app service carried
    # and its neighbors did not.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    network_mode: host
    # A Caddyfile rather than `caddy reverse-proxy`, because the CLI cannot
    # express PKI options and the default it gives you is a TWELVE-HOUR
    # certificate. That default assumes renewal always works; here it stopped
    # working and served an expired cert for 37 days. See ./Caddyfile.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      HEADROOM_MDNS_HOSTNAME: "${HEADROOM_MDNS_HOSTNAME:-headroom}"
      # Defaults to the mDNS name alone. Add the LAN IP (or a VPN hostname) to
      # reach it from anywhere `.local` cannot resolve — over Teleport,
      # Tailscale, WireGuard, or a different subnet:
      #
      #   HEADROOM_SITE_ADDRESSES="headroom.local, 10.0.111.4"
      #
      # Caddy then serves that address AND puts it in the certificate, signed
      # by the same root, so already-trusting devices need no reinstall.
      HEADROOM_SITE_ADDRESSES: "${HEADROOM_SITE_ADDRESSES:-${HEADROOM_MDNS_HOSTNAME:-headroom}.local}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - headroom

  # Publishes Caddy's CA where the non-root app can read it.
  #
  # Runs as root (so it can read the 0700 PKI) but touches nothing else: it
  # reads from a read-only mount and writes into a volume that holds nothing
  # but what it puts there.
  #
  # It polls instead of copying once because Caddy mints the CA a moment AFTER
  # startup on a first boot, and rotates the intermediate periodically
  # thereafter — a one-shot copy would race the former and leave the endpoint
  # 404ing until someone restarted the stack.
  #
  # TWO destinations, with deliberately different permissions:
  #
  #   /export/root.crt      0644 — the public trust anchor, served to anyone
  #                         who asks at /api/public/ca-certificate. A device
  #                         cannot reach the site until it has this.
  #   /export/pki/          0700, uid 1000 — the WHOLE authority, private keys
  #                         included, readable only by the app so it can put
  #                         them in a backup.
  #
  # The second one is why this stopped being a one-file copy. Every device that
  # browses the site installed root.crt by hand, and a root is self-signed —
  # nothing can vouch for a replacement. Losing this directory does not mean
  # "reissue a certificate", it means visiting every phone, tablet and laptop.
  # It lived only in Caddy's volume, on the same SD card whose unclean shutdown
  # caused the 37-day outage, and no backup contained it.
  #
  # uid 1000 matches the `headroom` user in the Dockerfile. Set
  # HEADROOM_BACKUP_INCLUDE_CA=false on the app to keep the keys out of
  # backups; the export itself stays, since it costs four small files.
  caddy-ca-export:
    image: caddy:2-alpine
    container_name: headroom-caddy-ca-export
    restart: unless-stopped
    # Bounded like the app is: an unbounded json-file log on a Pi's SD card
    # and an unbounded sidecar were the two limits the app service carried
    # and its neighbors did not.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 64m
    depends_on:
      - caddy
    volumes:
      - caddy-data:/data:ro
      - caddy-ca:/export
    entrypoint: ["/bin/sh", "-c"]
    # `cmp -s` before every `install`: an unconditional copy rewrote the same
    # bytes with a new mtime every minute, and the backup change-gate keyed
    # on mtime — so every daily check saw a change and a full tarball was
    # written every cycle. The gate now hashes content as well; copying only
    # what changed is the sidecar's half of the same fix, and it also stops
    # a sixty-second write to the SD card for nothing.
    command: >
      'PKI=/data/caddy/pki/authorities/local;
       while :; do
         if [ -f "$$PKI/root.crt" ]; then
           if ! cmp -s "$$PKI/root.crt" /export/root.crt; then
             install -m 0644 "$$PKI/root.crt" /export/root.crt;
           fi;
           mkdir -p /export/pki;
           chown 1000:1000 /export/pki;
           chmod 0700 /export/pki;
           for f in root.crt root.key intermediate.crt intermediate.key; do
             if [ -f "$$PKI/$$f" ] && ! cmp -s "$$PKI/$$f" "/export/pki/$$f"; then
               install -o 1000 -g 1000 -m 0600 "$$PKI/$$f" "/export/pki/$$f";
             fi;
           done;
         fi;
         sleep 60;
       done'

volumes:
  caddy-data:
  caddy-config:
  caddy-ca:
