# CI — runs the same checks a release does, on every PR and push to main.
#
# This exists to make the Dependabot PRs *trustworthy*: an update that breaks
# the suite, the typecheck, or the production build should say so by itself.
# Without it, every automated bump would still need a manual local run, which
# is the exact chore this repo kept skipping.
name: CI

on:
  push:
    branches: [main]
    # A squash-merge re-runs everything on main immediately after the PR run
    # that just passed on the same tree. That duplicate is worth keeping for
    # code (it catches semantic conflicts between two PRs merged close
    # together) and is pure waste for prose — so prose is excluded HERE and
    # not on `pull_request`, where these checks still gate every change.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Exact tag on purpose: setup-uv only publishes floating major tags up
      # to v7, so `@v9` does not resolve. Dependabot's github-actions ecosystem
      # keeps this current.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      # No python-version here on purpose: .python-version pins it, so CI runs
      # the same interpreter as the Docker image and bare metal.
      - name: Sync from the lockfile (same --frozen as the image)
        run: uv sync --frozen
      - name: Dockerfile Python matches .python-version
        # Dependabot's docker ecosystem bumps the image tag but not
        # .python-version, so without this the automation can drift them apart.
        run: |
          pinned=$(tr -d '[:space:]' < .python-version)
          grep -q "python:${pinned}-slim" Dockerfile \
            || { echo "Dockerfile python tag != .python-version ($pinned)"; grep -n '^FROM python:' Dockerfile; exit 1; }
      # Inside the backend job on purpose. A separate lint job would pay a
      # fresh runner + checkout + uv sync — a minute of billable startup — to
      # run something that takes about a second here.
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -q
      - name: Lock matches pyproject (--frozen alone does NOT check this)
        run: uv lock --check

  frontend:
    name: frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    env:
      # npm 12 logs a notice per script it runs, and the global install below
      # makes npm 11 print its upgrade nag. Warnings and errors still print —
      # this drops only the chatter, matching the Dockerfile's frontend stage.
      NPM_CONFIG_LOGLEVEL: warn
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # setup-node gives whatever npm ships with Node 26 (11.x). The image
      # builds the SPA on npm 12 (Dockerfile ARG NPM_VERSION), so pin the same
      # one here — otherwise this job green-lights a toolchain that never ships.
      - name: Pin npm to the version the image builds with
        run: npm install -g npm@12.0.2
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx vite build

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Catches the class of bug that shipped in 2.0.6: config the pinned
      # toolchain in the image can't actually parse. Tests alone missed it.
      # NO registry-backed layer cache here, and that is a measured decision
      # rather than an omission.
      #
      # `cache-to: type=gha,mode=max` was tried and made this job roughly 2.7x
      # SLOWER — 98s before, 204-284s after, including on runs that changed
      # nothing in the image. `mode=max` exports every intermediate layer to
      # GitHub's cache backend, and this image carries a 171 MB ONNX model plus
      # a full venv, so each run shipped on the order of a gigabyte over the
      # network to avoid a build that took 98 seconds. The cache cost more than
      # the thing it was caching.
      #
      # The BuildKit cache MOUNTS in the Dockerfile (npm, apt, the model) are a
      # different mechanism and are kept: they are local disk, they cost
      # nothing to consult, and they are aimed at the Raspberry Pi, where the
      # scarce resource is a home internet connection rather than a runner.
      - name: Build image
        run: docker build -t headroom:ci .
      - name: Container serves /health
        run: |
          docker run -d --name ci -p 8000:8000 headroom:ci
          timeout 120 bash -c 'until curl -fsS localhost:8000/health; do sleep 2; done' \
            || { echo "never became healthy"; docker logs ci; exit 1; }
