# Automated dependency updates.
#
# Why this exists: until now every bump in this repo was manual and reactive —
# something broke, or a scan was run by hand — so drift accumulated silently
# between those moments. This makes the updates arrive on their own.
#
# Security fixes are separate: Dependabot *alerts* must also be enabled in the
# repo's Settings → Code security. This file drives scheduled VERSION updates.
#
# Every ecosystem repeats `cooldown: default-days: 7` (mirroring
# `exclude-newer = "7 days"` in pyproject's [tool.uv]) and its own `groups`.
# That repetition is deliberate, not sloppy: Dependabot has no top-level
# defaults and its parser rejects YAML anchors/aliases
# (dependabot-core#1582), so there is nothing to factor out.
version: 2
updates:
  # --- Frontend (npm) ------------------------------------------------------ #
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One PR for the safe stuff, so routine churn isn't 8 separate reviews.
      minor-and-patch:
        update-types: [minor, patch]
    # Majors still come as individual PRs — vite/typescript/react majors deserve
    # their own review and a real build, not a rubber stamp.

  # --- Backend (uv / pyproject + uv.lock) ---------------------------------- #
  #
  # READ THIS BEFORE MERGING ONE OF THESE. A Dependabot PR here is a STARTING
  # POINT, not a mergeable change, and CI will say so.
  #
  # `requirements.txt` is a GENERATED artifact (`uv export`) that the Docker
  # image installs from — worth 490s of an 873s Pi rebuild, and byte-identical
  # across a version bump so a release doesn't bust that layer. Dependabot
  # cannot see that it is derived from `uv.lock`, and treats it as a manifest
  # in its own right. Two failure modes, both observed here:
  #
  #   1. A PR bumping ONLY requirements.txt — e.g. websockets 16.1.1 -> 17.0.1,
  #      a transitive dependency that is not in pyproject.toml at all. uv.lock
  #      never moves, so the file no longer matches it.
  #
  #   2. A PR bumping BOTH, independently, to DIFFERENT resolutions. A real
  #      one: uv.lock said annotated-types 0.7.0 while requirements.txt in the
  #      same PR said 0.8.0, and cbor2 (a WebAuthn dependency) was in one and
  #      not the other. The image would have installed a different dependency
  #      set than the tests ran against.
  #
  # `tests/test_requirements_export.py` catches both, so these PRs fail rather
  # than merging something incoherent. Do NOT "fix" them by regenerating on the
  # Dependabot branch — in case 2 that silently discards half the update.
  #
  # Instead take the whole thing coherently, on your own branch:
  #
  #     uv lock --upgrade
  #     uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
  #     uv sync && uv run pytest -q
  #
  # then close the Dependabot PRs as superseded. One resolution, one review.
  #
  # There is deliberately NO workflow auto-regenerating the file on these
  # branches. Doing so needs `pull_request_target` with a writable token plus a
  # checkout of the PR branch, which is the pwn-request pattern the required
  # `semgrep-cloud-platform/scan` check rejects (the rules live in the Semgrep
  # Cloud Platform app, not in this repo) — and suppressing that to save a
  # command is a bad trade.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # --- Container base images + the uv toolchain pin ------------------------- #
  # This is the one that would have caught uv 0.5.4 sitting stale from v0.2.0
  # through v2.0.6.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Ungrouped, every base-image bump is its own PR and its own full CI run
      # (which includes building the image). One PR is plenty.
      images:
        patterns: ["*"]

  # --- The workflows themselves -------------------------------------------- #
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
