# HTTPS overlay — put Headroom on the internet behind Caddy with automatic
# Let's Encrypt certificates.
#
#   HEADROOM_DOMAIN=hats.example.com \
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Requirements: DNS A/AAAA record for the domain pointing at this host, and
# ports 80+443 reachable from the internet. Also set the passkey identity to
# match the domain (HEADROOM_RP_ID / HEADROOM_ORIGIN below).

services:
  headroom:
    ports: !override []   # only Caddy is exposed; Headroom stays internal
    environment:
      HEADROOM_RP_ID: "${HEADROOM_DOMAIN:?set HEADROOM_DOMAIN}"
      HEADROOM_ORIGIN: "https://${HEADROOM_DOMAIN}"
      HEADROOM_CORS_ORIGINS: '["https://${HEADROOM_DOMAIN}"]'
      # Trust X-Forwarded-* only from inside this compose network, whose
      # subnet is pinned below. This was `"*"`, justified by :8000 not being
      # published — true, but it made the guarantee depend on a `ports:` line
      # NOT being added, which is a comment enforcing a rule rather than a
      # rule. It also stacked badly with how uvicorn reads the header: with
      # `"*"` every hop is trusted, so it takes the LEFTMOST X-Forwarded-For
      # entry, which is entirely client-supplied. Caddy strips incoming
      # X-Forwarded-* by default so nothing was exploitable — but adding
      # `trusted_proxies` to Caddy (required to sit behind a CDN) would turn
      # that into an unlimited password brute force against the login rate
      # limiter plus a falsified audit trail, and nothing here would say so.
      #
      # A CIDR re-enables uvicorn's right-to-left scan for the first untrusted
      # address, which is the behavior that makes the header meaningful.
      # SECURITY: still do not republish :8000 to the host/LAN here.
      FORWARDED_ALLOW_IPS: "172.31.71.0/24"

  # NOT interchangeable with the caddy service in docker-compose.https-lan.yml:
  # that one runs a Caddyfile (its own CA, 820-day leaves, a CA-export sidecar)
  # while this one keeps the CLI form because Let's Encrypt sets the lifetime.
  caddy:
    image: caddy:2-alpine
    container_name: headroom-caddy
    restart: unless-stopped
    # Bounded like the app is: an unbounded json-file log on a Pi's SD card
    # and an unbounded sidecar were the two limits the app service carried
    # and its neighbors did not.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      # UDP too. Caddy advertises HTTP/3 (`alt-svc: h3=":443"`) and served it
      # on a UDP port nothing published, so every fresh Safari/Chrome
      # connection paid a QUIC timeout before falling back to h2 — the same
      # stall 2.76.1 diagnosed on the LAN and fixed only there. Published,
      # h3 simply works.
      - "443:443/udp"
    environment:
      HEADROOM_DOMAIN: "${HEADROOM_DOMAIN:?set HEADROOM_DOMAIN}"
    # A Caddyfile rather than the `caddy reverse-proxy` CLI form, which
    # cannot add headers or compression: this is the internet-facing overlay,
    # and the app's own middleware documents that HSTS is Caddy's job here —
    # a promise the CLI form could not keep. Let's Encrypt still sets the
    # certificate lifetime; nothing in the file chooses one.
    volumes:
      - ./Caddyfile.https:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - headroom

volumes:
  caddy-data:
  caddy-config:

# Pinned so `FORWARDED_ALLOW_IPS` above names a real range. Compose otherwise
# allocates a subnet from Docker's pool at random, which would make the CIDR a
# guess that silently stops matching.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.71.0/24
