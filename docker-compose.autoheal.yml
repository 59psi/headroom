# Give the healthcheck a consumer.
#
#   docker compose -f docker-compose.yml -f docker-compose.autoheal.yml up -d
#
# WHY THIS EXISTS. `docker-compose.yml` defines a healthcheck that polls
# `/health/ready`, which fails on low disk and on a dead background worker —
# the two failures most likely to happen unattended. Nothing consumed it.
# Docker restart policies (`restart: unless-stopped`) fire when a container
# EXITS; they never fire on `unhealthy`. So a container sitting up with a dead
# import worker, or a volume with 200 MB free, stayed "running" indefinitely
# and the only place the answer appeared was a `docker ps` nobody was typing.
#
# WHY IT IS AN OVERLAY AND NOT THE BASE FILE. Autoheal works by talking to the
# Docker API, which means mounting `/var/run/docker.sock`. **That is
# root-equivalent access to the host** — a process that can drive the Docker
# socket can start a privileged container and own the machine. Putting that in
# the default deployment to recover a hobby app's background worker is a bad
# trade made silently. It is opt-in, and it is mounted READ-ONLY, which is
# enough for the restart call and blocks nothing autoheal needs.
#
# THE OTHER OPTION, WITH NO PRIVILEGE AT ALL, is a host-side timer that polls
# the endpoint over HTTP and restarts the unit. `scripts/headroom-watchdog.sh`
# plus the systemd units in docs/OPERATIONS.md §3 do exactly that and need no
# socket. Prefer it if you already run systemd on the host, which the Pi does.

services:
  autoheal:
    # `latest`, pinned by DIGEST. This was `1.2.0`, a 2021 build — holding a
    # root-equivalent socket — and the newest semver tag upstream publishes,
    # so no updater could ever move it: the project ships as `latest`
    # (rebuilt 2026-09-28, multi-arch incl. arm64). The digest is what makes
    # it a pin: what runs is exactly what was reviewed, and Dependabot's
    # docker-compose ecosystem bumps the digest when `latest` moves, as a PR
    # with CI in front of it rather than a silent pull.
    image: willfarrell/autoheal:latest@sha256:a83ba5a269ddff3bb2a9e0c59de2cfb9993c09d64a8b6584c4607ab5f6a69177
    restart: unless-stopped
    # Bounded like the app is: an unbounded json-file log on a Pi's SD card
    # and an unbounded sidecar were the two limits the app service carried
    # and its neighbors did not.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 64m
    environment:
      # Only containers explicitly labeled below — never "every unhealthy
      # container on the host", which is autoheal's default and would let this
      # file reach outside the deployment it ships with.
      AUTOHEAL_CONTAINER_LABEL: headroom.autoheal
      # The healthcheck already retries 3x at 30s before reporting unhealthy,
      # so by the time autoheal sees it the condition has persisted ~90s.
      # Waiting further just extends the outage.
      AUTOHEAL_START_PERIOD: "0"
      AUTOHEAL_INTERVAL: "30"
      # How long a restart waits for the app to stop before killing it. The
      # default is Docker's 10 s, which ignores the app's own
      # `stop_grace_period: 60s` — a restart from here would SIGKILL a WAL
      # checkpoint or a backup mid-write, the exact failure that grace period
      # exists to prevent. Matched to it.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "60"
    volumes:
      # Read-only: sufficient to list containers and POST a restart.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  headroom:
    labels:
      # Autoheal restarts containers carrying this label and only those.
      headroom.autoheal: "true"
