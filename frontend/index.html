<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Both: the unprefixed name is the standard one every other browser now
         wants, and Safari still reads only the apple- prefixed form, so
         dropping either loses fullscreen on one platform or logs a
         deprecation warning on every page load in the other. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#06010f" />
    <title>HEADROOM</title>
    <link rel="manifest" href="/manifest.json" />
    <!-- Tab favicon: the Headroom logo. .ico (16/32/48) is what browsers fetch
         as /favicon.ico; the 32px PNG covers modern hi-dpi tabs. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
