[project]
name = "headroom"
version = "2.2.1"
description = "Headroom — AI-powered hat collection tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic-settings",
    "python-multipart",
    "Pillow",
    "pillow-heif",
    "anthropic>=0.120.2",
    "rembg[cpu]>=2.0.77",
    "onnxruntime",
    "argon2-cffi>=25.1.0",
    "webauthn>=3.0.0",
    "qrcode>=8.2",
    "zeroconf>=0.150.0",
]

[dependency-groups]
dev = [
    "pytest",
    # anyio ships the pytest plugin that provides the `@pytest.mark.anyio`
    # marker; the tests run asyncio-only (see conftest `anyio_backend`), so no
    # trio extra and no separate `pytest-anyio` stub package are needed.
    "anyio",
]

[tool.uv]
# Floor a TRANSITIVE dep without making it a direct one. rembg → pymatting:
# pymatting 1.1.14 pins numba 0.53.1 → llvmlite 0.36.0, which only builds on
# Python <3.10, so letting the resolver pick it breaks `uv sync` on our 3.12
# baseline (and the Docker build). 1.1.15+ uses a numba that supports 3.12.
constraint-dependencies = ["pymatting>=1.1.15"]

# Supply-chain cooldown: ignore releases younger than this when resolving, so a
# compromised or broken package published minutes ago can't be pulled straight
# into a build. Verified not to hold back any of the security fixes in this
# lock — if a future CVE fix is newer than the window, drop it for that run.
exclude-newer = "7 days"

# ...but NOT for the crypto stack. The cooldown exists to dodge freshly
# published malicious packages; for cryptography a fresh release is usually the
# *security fix* itself, and waiting a week is the wrong trade. Concretely:
# cryptography 50.0.0 (the Bleichenbacher-oracle fix) landed inside the window,
# and a plain `uv lock` kept silently reverting to the vulnerable 49.0.0.
# pyopenssl rides along because <26.4 caps cryptography at <50.
exclude-newer-package = { cryptography = false, pyopenssl = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
