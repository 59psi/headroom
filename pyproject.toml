[project]
name = "headroom"
version = "2.46.0"
description = "Headroom — AI-powered hat collection tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic-settings",
    "python-multipart",
    "Pillow",
    "pillow-heif",
    "anthropic>=0.121.0",
    "rembg[cpu]>=2.0.78",
    "onnxruntime",
    "argon2-cffi>=25.1.0",
    "webauthn>=3.0.0",
    "qrcode>=8.2",
    "zeroconf>=0.150.0",
]

[dependency-groups]
dev = [
    "pytest",
    # 58 `# noqa: <CODE>` comments were written across this codebase to an
    # authority that was never installed, so none of them had ever been
    # checked and nothing enforced the style they assume. Runs inside the
    # existing backend CI job — a separate lint job would pay a fresh runner
    # to do a second of work.
    "ruff",
    # anyio ships the pytest plugin that provides the `@pytest.mark.anyio`
    # marker; the tests run asyncio-only (see conftest `anyio_backend`), so no
    # trio extra and no separate `pytest-anyio` stub package are needed.
    "anyio",
    # starlette's TestClient deprecated httpx in favour of httpx2 and emits a
    # StarletteDeprecationWarning on every run without it. Test-only: the app's
    # own outbound calls (eBay, Google Vision, melinrecap) still use httpx,
    # which is current at 0.28.1 and not deprecated in its own right.
    "httpx2",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# Floor a TRANSITIVE dep without making it a direct one. rembg depends on
# `pymatting>=1.1.14`, and 1.1.14 declares only `numba!=0.49.0` — no lower
# bound — so the resolver is free to pick an ancient numba (0.53.1 →
# llvmlite 0.36.0), which builds only on Python <3.10 and breaks `uv sync`
# and the Docker image. pymatting 1.1.15 declares `numba>=0.60.0`, which
# rules that out. Flooring rembg instead wouldn't help: its own floor is
# 1.1.14.
constraint-dependencies = ["pymatting>=1.1.15"]

# Supply-chain cooldown: ignore releases younger than this when resolving, so a
# compromised package published minutes ago can't land straight in a build. If a
# CVE fix is newer than the window, exempt that package below rather than
# lowering this globally.
exclude-newer = "7 days"

# ...but NOT for the crypto stack. The cooldown exists to dodge freshly
# published malicious packages; for cryptography a fresh release is usually the
# *security fix* itself, and waiting a week is the wrong trade. Concretely:
# cryptography 50.0.0 (the Bleichenbacher-oracle fix) landed inside the window,
# and a plain `uv lock` kept silently reverting to the vulnerable 49.0.0.
# pyopenssl rides along because <26.4 caps cryptography at <50.
exclude-newer-package = { cryptography = false, pyopenssl = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.ruff]
line-length = 100
# `src/` layout, so first-party imports resolve for isort-style rules.
src = ["src", "tests"]

[tool.ruff.lint]
# Deliberately close to ruff's defaults plus the rule families whose `noqa`
# codes already appear in this tree (BLE001, PLC0415, S105) — turning on
# everything would bury a real finding under a thousand style opinions on a
# codebase that has never once been linted.
select = [
    "E", "F", "W",   # pyflakes + pycodestyle: real errors, unused names
    "B",             # bugbear: mutable defaults, shadowed loop vars
    "BLE",           # blind except — 40+ `noqa: BLE001` here were never checked
    "PLC0415",       # import-outside-top-level — the other suppression in use
    "S105", "S106",  # hardcoded credentials
]
ignore = [
    "E501",     # line length: prose-heavy comments are deliberate here
    "B008",     # FastAPI's `Depends()` in a default IS the framework's idiom
    "PLC0415",  # import-outside-top-level: a deliberate pattern here, used to
                # break import cycles and keep heavy modules (sqlite3, rembg,
                # retail_pricing) off the boot path. 33 sites, all intentional.
    "E402",     # same reason in reverse — `tests/conftest.py` MUST pop the API
                # keys out of os.environ before any app module is imported, or
                # config.py reads them at import time and the suite starts
                # talking to live APIs.
]
# Deliberately NOT enabling `UP` or the rest of `PL`. `UP017` alone would
# rewrite ~90 call sites from `datetime.now(timezone.utc)` to `datetime.UTC`,
# against a convention this repo documents in CLAUDE.md — a linter's job here
# is to find the mistakes nobody checked for, not to relitigate a house style.

[tool.ruff.lint.per-file-ignores]
# Tests assert, sleep, and use hard-coded credentials on purpose.
"tests/*" = ["S", "PLC0415", "BLE001"]


[tool.coverage.run]
source = ["src/headroom"]
# The measurement is about OUR code. Branch coverage because this codebase's
# risk is concentrated in degradation paths — "Claude unconfigured", "rembg
# failed", "worker dead" — which are branches, not statements, and a
# statement-only number scores them as covered the moment the happy path runs.
branch = true

[tool.coverage.report]
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
