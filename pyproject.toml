[project]
name = "headroom"
version = "2.23.0"
description = "Headroom — AI-powered hat collection tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "aiosqlite",
    "pydantic-settings",
    "python-multipart",
    "Pillow",
    "pillow-heif",
    "anthropic>=0.121.0",
    "rembg[cpu]>=2.0.77",
    "onnxruntime",
    "argon2-cffi>=25.1.0",
    "webauthn>=3.0.0",
    "qrcode>=8.2",
    "zeroconf>=0.150.0",
]

[dependency-groups]
dev = [
    "pytest",
    # anyio ships the pytest plugin that provides the `@pytest.mark.anyio`
    # marker; the tests run asyncio-only (see conftest `anyio_backend`), so no
    # trio extra and no separate `pytest-anyio` stub package are needed.
    "anyio",
    # starlette's TestClient deprecated httpx in favour of httpx2 and emits a
    # StarletteDeprecationWarning on every run without it. Test-only: the app's
    # own outbound calls (eBay, Google Vision, melinrecap) still use httpx,
    # which is current at 0.28.1 and not deprecated in its own right.
    "httpx2",
]

[tool.uv]
# Floor a TRANSITIVE dep without making it a direct one. rembg depends on
# `pymatting>=1.1.14`, and 1.1.14 declares only `numba!=0.49.0` — no lower
# bound — so the resolver is free to pick an ancient numba (0.53.1 →
# llvmlite 0.36.0), which builds only on Python <3.10 and breaks `uv sync`
# and the Docker image. pymatting 1.1.15 declares `numba>=0.60.0`, which
# rules that out. Flooring rembg instead wouldn't help: its own floor is
# 1.1.14.
constraint-dependencies = ["pymatting>=1.1.15"]

# Supply-chain cooldown: ignore releases younger than this when resolving, so a
# compromised package published minutes ago can't land straight in a build. If a
# CVE fix is newer than the window, exempt that package below rather than
# lowering this globally.
exclude-newer = "7 days"

# ...but NOT for the crypto stack. The cooldown exists to dodge freshly
# published malicious packages; for cryptography a fresh release is usually the
# *security fix* itself, and waiting a week is the wrong trade. Concretely:
# cryptography 50.0.0 (the Bleichenbacher-oracle fix) landed inside the window,
# and a plain `uv lock` kept silently reverting to the vulnerable 49.0.0.
# pyopenssl rides along because <26.4 caps cryptography at <50.
exclude-newer-package = { cryptography = false, pyopenssl = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
