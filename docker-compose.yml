services:
  headroom:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamp the footer with a build id:
        #   ./scripts/stamp-build.sh   # writes it to .env, once, then forget it
        # or inline:
        #   HEADROOM_BUILD_SHA=$(git rev-parse --short HEAD) docker compose up --build -d
        #
        # BUILD_SHA is accepted as a fallback because it is the name people
        # reach for, and a build arg that silently stays empty when you set the
        # wrong one is a bad way to find that out — the footer just never
        # appears, with nothing to indicate why.
        HEADROOM_BUILD_SHA: ${HEADROOM_BUILD_SHA:-${BUILD_SHA:-}}
        # Which rembg model gets pre-downloaded INTO the image and used at
        # runtime. Change it at build time so the weights are baked in:
        #   REMBG_MODEL=u2netp docker compose up -d --build
        REMBG_MODEL: ${REMBG_MODEL:-isnet-general-use}
    image: headroom:latest
    container_name: headroom
    restart: unless-stopped
    # Docker's default is 10 s from SIGTERM to SIGKILL. Shutdown here stops
    # four workers, lets an in-flight per-hat commit finish and then
    # checkpoints the WAL — and a scheduled backup that happened to be
    # running used to be killed mid-tar, leaving a torn archive under a real
    # name (now written under `.partial` and renamed only when whole). Sixty
    # seconds covers the shutdown sequence on a Pi; a backup that is still
    # writing at that point is abandoned as a partial and swept at boot.
    stop_grace_period: 60s
    # Nothing the app writes lives outside `/data` (the volume) and `/tmp`
    # (the upload spool before it is moved onto the volume). The image no
    # longer chowns `/app` to the runtime user; this is the other half —
    # code that cannot be edited in place by a compromised process. Verified:
    # the container boots and passes readiness this way.
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8000:8000"
    volumes:
      - headroom-data:/data
    environment:
      # Provide your Anthropic key here OR via the Settings UI (DB takes precedence).
      # HEADROOM_ANTHROPIC_API_KEY: "sk-ant-..."
      # Optional: Google Cloud Vision key for fallback brand detection when
      # Claude is unavailable (colors always fall back locally, no key needed).
      # HEADROOM_GOOGLE_VISION_API_KEY: "AIzaSy..."
      # NOT pinned here on purpose: a value in `environment:` beats the image's
      # ENV, which would override the model baked in by the REMBG_MODEL build
      # arg above. Set it here only to force a model that is NOT in the image
      # (the Pi will then download it on first use).
      # The base install's own origin, unless `.env` says otherwise. Anyone
      # fronting THIS file with their own TLS (Tailscale Serve, a NAS reverse
      # proxy, a tunnel) needs these four to reach the container — they used
      # to be set only by the shipped HTTPS overlays, so a `.env` value for
      # them reached nothing: passkeys could never work and `tls_health` went
      # on probing `http://localhost:8000`. An overlay's explicit value still
      # wins the merge over a passthrough.
      HEADROOM_CORS_ORIGINS: ${HEADROOM_CORS_ORIGINS:-["http://localhost:8000"]}
      HEADROOM_RP_ID: "${HEADROOM_RP_ID:-}"
      HEADROOM_ORIGIN: "${HEADROOM_ORIGIN:-}"
      HEADROOM_MDNS_PORT: "${HEADROOM_MDNS_PORT:-}"
      # ---- Operator knobs, forwarded from `.env` ---------------------------
      # Compose's `.env` feeds variable INTERPOLATION only; it never becomes the
      # container's environment. Every variable the docs tell you to "set in
      # .env" therefore needs a line here or the app reads nothing — which is
      # exactly what happened: `HEADROOM_SETUP_TOKEN` in `.env` protected
      # nothing, silently, and `HEADROOM_MDNS_HOSTNAME=hats` renamed Caddy's
      # certificate while the app kept advertising `headroom.local`. Empty
      # (`${VAR:-}`) means "unset" to every reader, so an untouched `.env`
      # changes nothing. `HEADROOM_REMBG_MODEL` is deliberately NOT here — see
      # the note above about the baked-in model.
      HEADROOM_SETUP_TOKEN: "${HEADROOM_SETUP_TOKEN:-}"
      HEADROOM_LOG_LEVEL: "${HEADROOM_LOG_LEVEL:-}"
      HEADROOM_ANTHROPIC_API_KEY: "${HEADROOM_ANTHROPIC_API_KEY:-}"
      HEADROOM_ANTHROPIC_MODEL: "${HEADROOM_ANTHROPIC_MODEL:-}"
      HEADROOM_GOOGLE_VISION_API_KEY: "${HEADROOM_GOOGLE_VISION_API_KEY:-}"
      HEADROOM_EBAY_APP_ID: "${HEADROOM_EBAY_APP_ID:-}"
      HEADROOM_EBAY_CERT_ID: "${HEADROOM_EBAY_CERT_ID:-}"
      HEADROOM_HTTP_TIMEOUT: "${HEADROOM_HTTP_TIMEOUT:-}"
      # The Melin Recap client id is baked in, and OPERATIONS §9 tells the
      # operator to set this when Treet rotates it. A knob the docs name is a
      # knob that has to reach the container.
      HEADROOM_MELIN_CLIENT_ID: "${HEADROOM_MELIN_CLIENT_ID:-}"
      HEADROOM_MDNS_ENABLED: "${HEADROOM_MDNS_ENABLED:-}"
      HEADROOM_MDNS_HOSTNAME: "${HEADROOM_MDNS_HOSTNAME:-}"
      HEADROOM_MDNS_INTERFACE: "${HEADROOM_MDNS_INTERFACE:-}"
      HEADROOM_IMPORT_WORKER_ENABLED: "${HEADROOM_IMPORT_WORKER_ENABLED:-}"
      HEADROOM_ANALYSIS_WORKER_ENABLED: "${HEADROOM_ANALYSIS_WORKER_ENABLED:-}"
      HEADROOM_REMBG_CONCURRENCY: "${HEADROOM_REMBG_CONCURRENCY:-}"
      HEADROOM_BACKUP_ENABLED: "${HEADROOM_BACKUP_ENABLED:-}"
      HEADROOM_BACKUP_INTERVAL_HOURS: "${HEADROOM_BACKUP_INTERVAL_HOURS:-}"
      HEADROOM_BACKUP_KEEP: "${HEADROOM_BACKUP_KEEP:-}"
      # The pre-2.40 name for the same count, still read so an old `.env` keeps meaning something.
      HEADROOM_BACKUP_RETENTION_DAYS: "${HEADROOM_BACKUP_RETENTION_DAYS:-}"
      HEADROOM_BACKUP_UPLOAD_CMD: "${HEADROOM_BACKUP_UPLOAD_CMD:-}"
      HEADROOM_BACKUP_UPLOAD_TIMEOUT: "${HEADROOM_BACKUP_UPLOAD_TIMEOUT:-}"
      HEADROOM_REPRICING_ENABLED: "${HEADROOM_REPRICING_ENABLED:-}"
      HEADROOM_REPRICING_INTERVAL_HOURS: "${HEADROOM_REPRICING_INTERVAL_HOURS:-}"
      HEADROOM_REPRICING_DELAY_SECONDS: "${HEADROOM_REPRICING_DELAY_SECONDS:-}"
      HEADROOM_REPRICING_BATCH_LIMIT: "${HEADROOM_REPRICING_BATCH_LIMIT:-}"
      HEADROOM_ACTIVITY_LOG_RETENTION_DAYS: "${HEADROOM_ACTIVITY_LOG_RETENTION_DAYS:-}"
      HEADROOM_DISK_MIN_FREE_MB: "${HEADROOM_DISK_MIN_FREE_MB:-}"
      HEADROOM_DISK_WARN_PCT: "${HEADROOM_DISK_WARN_PCT:-}"
      HEADROOM_MAX_BODY_BYTES: "${HEADROOM_MAX_BODY_BYTES:-}"
      HEADROOM_SQLITE_SYNCHRONOUS: "${HEADROOM_SQLITE_SYNCHRONOUS:-}"
      # Password for the Synology / rsync-daemon backup target, forwarded from
      # your `.env` into the container.
      #
      # This line is load-bearing and its absence was a silent bug: Compose's
      # `.env` feeds variable INTERPOLATION only, it does not become the
      # container's environment. Without this passthrough the docs said "put it
      # in .env" and the app then read nothing, so `upload_env()` returned None
      # and rsync sat waiting for a password on a non-tty until the upload
      # timed out. The tests missed it because they `monkeypatch.setenv`
      # in-process, where no container boundary exists to cross.
      #
      # Empty by default, which `upload_env()` treats as "not configured" —
      # so this is inert unless you set it.
      HEADROOM_BACKUP_RSYNC_PASSWORD: "${HEADROOM_BACKUP_RSYNC_PASSWORD:-}"
      # Whether backups carry Caddy's local CA, private keys included. Same
      # passthrough reasoning as the line above — setting it in `.env` alone
      # would do nothing.
      #
      # Default true: the root of that CA is installed BY HAND on every device
      # that browses the site, and a root is self-signed, so nothing can vouch
      # for a replacement. Losing it means visiting every phone and laptop, and
      # it lived only in Caddy's volume — on the card whose unclean shutdown
      # caused the 37-day HTTPS outage.
      #
      # Set false if your backups travel somewhere you would rather that key
      # did not: anyone holding it can mint a certificate for ANY host those
      # devices will trust, which is a broader capability than anything else
      # in the archive.
      HEADROOM_BACKUP_INCLUDE_CA: "${HEADROOM_BACKUP_INCLUDE_CA:-true}"
    # Bound the container so a memory spike fails as a scoped, diagnosable
    # event instead of competing for the whole machine. The peak here is the
    # photo pipeline: a ~179MB rembg model resident alongside a full-resolution
    # Pillow decode. Without a limit, the kernel's OOM killer picks a victim
    # across the entire Pi — which can be sshd, or the container, killed with
    # SIGKILL so nothing is logged and `docker inspect` is the only evidence.
    # With a limit, Docker records OOMKilled=true against THIS container.
    #
    # 1G suits a 2GB Pi. Raise it on bigger hardware; a value below ~640M will
    # kill the analysis worker mid-inference.
    #
    # Raspberry Pi OS ships with the memory cgroup DISABLED, so Docker prints
    # "Your kernel does not support memory limit capabilities ... Limitation
    # discarded" and ignores this. Add `cgroup_enable=memory cgroup_memory=1`
    # to /boot/firmware/cmdline.txt and reboot — see docs/OPERATIONS.md §7.
    # Harmless when unsupported; you just don't get the ceiling.
    mem_limit: ${HEADROOM_MEM_LIMIT:-1g}
    # Equal to mem_limit so the container cannot silently swap itself to a
    # crawl on an SD card instead of failing honestly.
    memswap_limit: ${HEADROOM_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  headroom-data:
