services:
  headroom:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamp the footer with a build id:
        #   ./scripts/stamp-build.sh   # writes it to .env, once, then forget it
        # or inline:
        #   HEADROOM_BUILD_SHA=$(git rev-parse --short HEAD) docker compose up --build -d
        #
        # BUILD_SHA is accepted as a fallback because it is the name people
        # reach for, and a build arg that silently stays empty when you set the
        # wrong one is a bad way to find that out — the footer just never
        # appears, with nothing to indicate why.
        HEADROOM_BUILD_SHA: ${HEADROOM_BUILD_SHA:-${BUILD_SHA:-}}
        # Which rembg model gets pre-downloaded INTO the image and used at
        # runtime. Change it at build time so the weights are baked in:
        #   REMBG_MODEL=u2netp docker compose up -d --build
        REMBG_MODEL: ${REMBG_MODEL:-isnet-general-use}
    image: headroom:latest
    container_name: headroom
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - headroom-data:/data
    environment:
      # Provide your Anthropic key here OR via the Settings UI (DB takes precedence).
      # HEADROOM_ANTHROPIC_API_KEY: "sk-ant-..."
      # Optional: Google Cloud Vision key for fallback brand detection when
      # Claude is unavailable (colors always fall back locally, no key needed).
      # HEADROOM_GOOGLE_VISION_API_KEY: "AIzaSy..."
      # NOT pinned here on purpose: a value in `environment:` beats the image's
      # ENV, which would override the model baked in by the REMBG_MODEL build
      # arg above. Set it here only to force a model that is NOT in the image
      # (the Pi will then download it on first use).
      HEADROOM_CORS_ORIGINS: '["http://localhost:8000"]'
      # Password for the Synology / rsync-daemon backup target, forwarded from
      # your `.env` into the container.
      #
      # This line is load-bearing and its absence was a silent bug: Compose's
      # `.env` feeds variable INTERPOLATION only, it does not become the
      # container's environment. Without this passthrough the docs said "put it
      # in .env" and the app then read nothing, so `upload_env()` returned None
      # and rsync sat waiting for a password on a non-tty until the upload
      # timed out. The tests missed it because they `monkeypatch.setenv`
      # in-process, where no container boundary exists to cross.
      #
      # Empty by default, which `upload_env()` treats as "not configured" —
      # so this is inert unless you set it.
      HEADROOM_BACKUP_RSYNC_PASSWORD: "${HEADROOM_BACKUP_RSYNC_PASSWORD:-}"
      # Whether backups carry Caddy's local CA, private keys included. Same
      # passthrough reasoning as the line above — setting it in `.env` alone
      # would do nothing.
      #
      # Default true: the root of that CA is installed BY HAND on every device
      # that browses the site, and a root is self-signed, so nothing can vouch
      # for a replacement. Losing it means visiting every phone and laptop, and
      # it lived only in Caddy's volume — on the card whose unclean shutdown
      # caused the 37-day HTTPS outage.
      #
      # Set false if your backups travel somewhere you would rather that key
      # did not: anyone holding it can mint a certificate for ANY host those
      # devices will trust, which is a broader capability than anything else
      # in the archive.
      HEADROOM_BACKUP_INCLUDE_CA: "${HEADROOM_BACKUP_INCLUDE_CA:-true}"
    # Bound the container so a memory spike fails as a scoped, diagnosable
    # event instead of competing for the whole machine. The peak here is the
    # photo pipeline: a ~179MB rembg model resident alongside a full-resolution
    # Pillow decode. Without a limit, the kernel's OOM killer picks a victim
    # across the entire Pi — which can be sshd, or the container, killed with
    # SIGKILL so nothing is logged and `docker inspect` is the only evidence.
    # With a limit, Docker records OOMKilled=true against THIS container.
    #
    # 1G suits a 2GB Pi. Raise it on bigger hardware; a value below ~640M will
    # kill the analysis worker mid-inference.
    #
    # Raspberry Pi OS ships with the memory cgroup DISABLED, so Docker prints
    # "Your kernel does not support memory limit capabilities ... Limitation
    # discarded" and ignores this. Add `cgroup_enable=memory cgroup_memory=1`
    # to /boot/firmware/cmdline.txt and reboot — see docs/OPERATIONS.md §7.
    # Harmless when unsupported; you just don't get the ceiling.
    mem_limit: ${HEADROOM_MEM_LIMIT:-1g}
    # Equal to mem_limit so the container cannot silently swap itself to a
    # crawl on an SD card instead of failing honestly.
    memswap_limit: ${HEADROOM_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  headroom-data:
